<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Axis ShareVision: Proposed Residence menu</title>
<style>
:root{--bg:#eef0f6;--panel:#fff;--ink:#1d2340;--mute:#5d6483;--line:#d9dcea;--navy:#14246b;--blue:#2d4a9b;--gold:#f2bd5b;--goldd:#e3a93d;--new:#e6f5ec;--newb:#2a8a55;--hl:#eef1fb;--ok:#2a8a55;--warn:#fff3d6;--warnb:#b57a0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152a;--panel:#1c2140;--ink:#e8eaf6;--mute:#a4abcc;--line:#343a63;--new:#143626;--newb:#52c488;--hl:#252b52;--warn:#3a2f12;--warnb:#e6b04d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{padding:16px 20px 4px}.top h1{margin:0;font-size:20px}.top p{margin:4px 0 0;color:var(--mute)}
.stage{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;padding:16px 20px 40px;align-items:start}
.phone{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;color:var(--navy)}
.phone .hd{background:var(--blue);color:#fff;padding:14px 16px;font-weight:700;font-size:17px}
.phone .hd small{display:block;font-weight:400;font-size:12px;opacity:.85}
.grp{background:var(--gold);color:var(--navy);font-weight:700;padding:11px 14px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--navy);text-transform:uppercase;font-size:15px}
.grp .tag{margin-left:auto;font-size:11px;text-transform:none;background:var(--new);color:#1f6f43;border:1px solid #2a8a55;border-radius:10px;padding:1px 8px}
.item{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #e3e5f0;padding:14px 18px;font:600 16px "Segoe UI",Roboto,Arial,sans-serif;color:var(--navy);cursor:pointer}
.item:hover{background:#f1f3fb}.item[aria-current=true]{background:#dfe5fb;box-shadow:inset 4px 0 0 var(--navy)}
.item.static{cursor:default}.item.static:hover{background:#fff}
.newbox{box-shadow:inset 3px 0 0 var(--newb)}
.legend{padding:10px 14px;font-size:12px;color:#5d6483;background:#f6f7fb}
.switch{display:flex;gap:6px;margin:0 0 12px}
.switch button{flex:1;font:inherit;font-size:13px;padding:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer}
.switch button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.view{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:420px}
.view h2{margin:0;padding:14px 18px;font-size:18px;color:var(--ink);border-bottom:1px solid var(--line)}
.view .in{padding:16px 18px}
.ctx{background:var(--hl);border-left:3px solid var(--blue);padding:8px 12px;margin-bottom:14px;color:var(--mute);font-size:13px}
.ppl{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.ppl span{border:1px solid var(--line);border-radius:14px;padding:2px 10px;color:var(--ink)}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--mute)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 8px}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.s2{grid-column:1/-1}
.btn{font:inherit;font-weight:600;border:0;border-radius:4px;background:var(--navy);color:#fff;padding:8px 16px;cursor:pointer}
.btn.sm{padding:4px 10px;font-size:12px}
.wrap{overflow-x:auto;margin-top:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mute);font-size:12px}
td input{width:72px}
.st{font-size:12px;font-weight:600;border:1px solid;border-radius:10px;padding:1px 8px}
.st.ok{color:var(--newb);background:var(--new);border-color:var(--newb)}.st.p{color:var(--warnb);background:var(--warn);border-color:var(--warnb)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.task{flex-direction:row;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:400;color:var(--ink)}
.task.d span{text-decoration:line-through;color:var(--mute)}.task input{margin-top:4px}
:root{--ttl:#14246b;--gl:#5a6db3;--gh:#ccd2e3;--band:#ceffdf;--bandt:#14312a;--pgb:#b3badb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ttl:#a9b8ff;--gh:#2a3050;--band:#1f4a37;--bandt:#dff7ea;--pgb:#2f3659}}
.sv{padding:14px 18px 22px}
.crumbs{color:var(--mute);font-size:14px;padding-bottom:10px;border-bottom:1px dotted var(--mute)}
.crumbs span{background:var(--hl);border-radius:4px;padding:3px 9px;margin-right:2px}
.crumbs b{color:var(--ttl);font-size:16px;font-weight:600}
.gl{height:3px;background:var(--gl);margin:14px 0}
.stt,.ftitle{color:var(--ttl);font-size:24px;font-weight:500;margin:6px 0 4px}
.dots{border-bottom:1px dotted var(--mute);margin-bottom:12px}
.plus{width:38px;height:38px;border-radius:50%;border:0;background:var(--hl);color:#3c9a4a;font-size:26px;line-height:1;cursor:pointer;margin-bottom:12px}
table.g thead th{background:var(--gh);color:var(--ink);font-size:15px}
table.g td{font-size:15px}
.pen{border:0;background:var(--hl);color:#3c9a4a;border-radius:16px;padding:4px 14px;cursor:pointer;font-size:15px}
.acts{display:flex;gap:18px;margin:4px 0 10px}
.act{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ttl);font-size:16px;font-family:inherit;cursor:pointer}
.act i{width:34px;height:34px;border-radius:50%;background:var(--hl);display:grid;place-items:center;font-style:normal;font-weight:700}
.act .ok{color:#3c9a4a}.act .no{color:#e0962d}
.fr{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:16px;align-items:center;padding:5px 0}
.fr input[type=date],.fr select,.fr input[type=text]{width:100%;max-width:560px}
label.lb{display:block;text-align:right;font-size:15px;font-weight:600;color:var(--ink)}
.fr input[type=checkbox]{width:18px;height:18px;justify-self:start;padding:0}
.band{background:var(--band);color:var(--bandt);font-weight:600;font-size:19px;padding:9px 14px;margin:14px 0 8px}
.bad{border-color:#c0392b!important}
.toast{background:var(--new);color:var(--newb);border:1px solid var(--newb);border-radius:4px;padding:6px 12px;margin-bottom:10px;font-weight:600}
.xc{border:1px solid var(--line);border-top:4px solid var(--gl);border-radius:4px;padding:12px 18px 16px}
.xt{color:var(--ttl);font-size:28px;font-weight:500;margin:2px 0 4px}
.add{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--ink);font-size:18px;font-family:inherit;cursor:pointer;padding:0;margin:10px 0 14px}
.add i{width:38px;height:38px;border-radius:50%;background:var(--hl);color:#3c9a4a;display:grid;place-items:center;font-style:normal;font-size:24px}
.gx{width:100%;min-width:560px}.gx th{background:var(--gh);color:var(--ink);font-size:15px}.gx td{font-size:15px}
.xr{cursor:pointer}.xr:hover td{background:var(--hl)}
.fi{display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;font-size:10px;margin-left:10px;vertical-align:middle}
.empty{text-align:center;color:var(--mute);font-style:italic;padding:16px}
.cut{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{background:var(--pgb);padding:10px 12px;display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.pg b{background:#f5b94a;color:#fff;padding:6px 14px;border-radius:2px}
.pg .arr{background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:2px}.pg .info{margin-left:auto}
.alert{background:#e60026;color:#fff;border-radius:4px;padding:10px 14px;margin:10px 0}
span.lb{display:block;text-align:right;font-size:15px;font-weight:600;color:var(--ink)}
.req{color:#e60026}
.fr label.cb{flex-direction:row;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:400;color:var(--ink)}
.fr textarea{width:100%;max-width:560px}
.bad2 .lb{color:#e60026}
@media (max-width:620px){span.lb{text-align:left}}
@media (max-width:620px){.fr{grid-template-columns:1fr;gap:4px}label.lb{text-align:left}}
@media (max-width:820px){.stage{grid-template-columns:1fr}form{grid-template-columns:1fr}}
.cl-wrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line)}
table.cl{min-width:640px}
table.cl th{background:var(--band);color:var(--bandt);text-align:center;font-size:14px;padding:8px 6px}
table.cl th:first-child{text-align:left;padding-left:12px}
table.cl td{padding:6px;text-align:center;font-size:14px}
table.cl td:first-child{text-align:left;padding-left:12px;width:38%}
table.cl tbody tr:nth-child(even){background:var(--hl)}
table.cl input[type=checkbox]{width:18px;height:18px}
.fi{cursor:pointer;background:none;color:inherit;font-family:inherit;padding:0}
.fi.on{background:var(--ink);color:var(--panel)}
.fpop{position:absolute;z-index:5;top:100%;left:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.2);padding:10px;min-width:230px;font-weight:400;font-size:14px;text-align:left}
.fpop select,.fpop input{width:100%;margin-bottom:8px}
.fpop button{margin-right:6px;font:inherit;padding:4px 12px;border:1px solid var(--line);background:var(--hl);color:var(--ink);border-radius:3px;cursor:pointer}
.fnote{color:var(--mute);font-size:13px;margin:0 0 8px}
th{position:relative}
</style>
</head>
<body>

<div>

</div>
<div class="view" id="view"></div>
</div>

['Yard &amp; Deck',['Lawn mowed &amp; weeded as needed','Weeds/Grass clippings removed as needed','Grass watered on watering day','Driveway shovelled in winter','Deck tidy','Garbage removed – check for weapons/ items not needed (shovels, tools, etc.)']]];
function exchangeView(v){

if(xs.m=='list'){

function fHtml(key){var f=fl[key]||{op:'ge',val:''};return '<span class="fi'+(f.val?' on':'')+'" id="fib" role="button" tabindex="0" aria-label="Filter by date">&#9662;</span><div class="fpop" id="fpop" hidden><select id="fop" aria-label="Operator">'+Object.keys(OPS).map(function(k){return '<option value="'+k+'"'+(f.op==k?' selected':'')+'>Is '+OPS[k].slice(3)+'</option>'}).join('')+'</select><input type="date" id="fv" value="'+f.val+'" aria-label="Date"><button id="fgo">Filter</button><button id="fclr">Clear</button></div>'}
function fNote(key){var f=fl[key];return f&&f.val?'<p class="fnote">Filter: Date '+OPS[f.op]+' '+f.val+'</p>':''}
function fWire(key,redo){$('fib').onclick=function(e){e.stopPropagation();var P=$('fpop');P.hidden=!P.hidden;if(!P.hidden){var r=$('fib').getBoundingClientRect();P.style.position='fixed';P.style.top=(r.bottom+6)+'px';P.style.left=Math.max(8,Math.min(r.left,innerWidth-250))+'px'}};$('fpop').onclick=function(e){e.stopPropagation()};
$('fgo').onclick=function(){fl[key]={op:$('fop').value,val:$('fv').value};redo()};$('fclr').onclick=function(){delete fl[key];redo()}}
function recs(k){return rec[k]||(rec[k]=[{d:'2026-10-23',run:'8 Hour',part:'Morning',a:'Staff A',b:'None',c:{'Shift exchange':1}}])}
var RUNS={'8 Hour':1,'12 Hour':2,'24 Hour':3};
function plan(run,part){if(cur=='Day Chores')return run=='8 Hour'?[part]:['Morning','Afternoon'];return ['Night']}
function blocks(run,part){var P=plan(run,part),n=P.length,seen={},hold={'Shift exchange':1,'Documentation / Confirm Hours':1},out=[['Start Of Shift',['Shift exchange']]];
P.forEach(function(nm,i){var list=CH[nm+' Chores'].filter(function(t){if(hold[t]||seen[t])return false;seen[t]=1;return true});out.push([nm+' Block'+(n>1?' ('+(i+1)+' of '+n+')':''),list])});
out.push(['End Of Shift',['Documentation / Confirm Hours']]);return out}
function taskView(v){
var R=recs(cur);
if(tv.m=='list'){
v.innerHTML='<div class="sv"><div class="crumbs"><span>Residences</span> / <span>'+SITE+'</span> / <b>'+cur+' - '+SITE+'</b></div><div class="gl"></div>'+(tv.msg?'<div class="toast" role="status">'+tv.msg+'</div>':'')+'<div class="stt">'+cur+'</div><div class="dots"></div>'+fNote(cur)+'<button class="plus" id="add" aria-label="Add new item" title="Add New Item">+</button><button class="pen" id="exp" style="margin-left:12px;height:38px;vertical-align:top">Export Report</button><div class="wrap"><table class="g"><thead><tr><th>Date'+fHtml(cur)+'</th><th>Residence</th><th>Running</th><th>Staff 1</th><th>Staff 2</th><th></th></tr></thead><tbody>'+R.map(function(r,i){if(!fOk(r.d,fl[cur]))return '';return '<tr><td>'+r.d+'</td><td>'+SITE+'</td><td>'+r.run+(cur=='Day Chores'&&r.run=='8 Hour'?' ('+r.part+')':'')+'</td><td>'+(r.a=='None'?'':r.a)+'</td><td>'+(r.b=='None'?'':r.b)+'</td><td><button class="pen" data-i="'+i+'" aria-label="Edit item">&#9998;</button></td></tr>'}).join('')+'</tbody></table></div></div>';
tv.msg='';
$('add').onclick=function(){tv={m:'form',i:null};view()};
fWire(cur,view);
$('exp').onclick=function(){rp.src='Chores';rp.shift=cur.split(' ')[0];xp={cur:cur};view()};
v.querySelectorAll('.pen[data-i]').forEach(function(b){b.onclick=function(){tv={m:'form',i:+b.dataset.i};view()}});return}
var r=tv.draft||(tv.i===null?{d:'',run:'8 Hour',part:'Morning',a:'None',b:'None',c:{}}:R[tv.i]);tv.draft=null;
var S=blocks(r.run,r.part),isDay=cur=='Day Chores';
v.innerHTML='<div class="sv"><div class="crumbs"><span>Home</span> / <span>Residences</span> / <span>'+SITE+'</span> / <span>'+cur+'</span> / <b>'+(tv.i===null?'New Item':'Edit Item')+'</b></div><div class="gl"></div><div class="acts"><button class="act" id="sv-save"><i class="ok">&#10003;</i>Save</button><button class="act" id="sv-cancel"><i class="no">&minus;</i>Cancel</button></div><div class="ftitle">'+cur+' - '+SITE+' - '+(tv.i===null?'New Item':'Edit Item')+'</div>'+
'<div class="fr"><label class="lb">Currently running</label><div style="display:flex;gap:18px;flex-wrap:wrap">'+Object.keys(RUNS).filter(function(k){return isDay||k!='24 Hour'}).map(function(k){return '<label class="cb" style="display:flex;gap:6px;align-items:center"><input type="radio" name="run" value="'+k+'"'+(r.run==k?' checked':'')+'> '+k+'</label>'}).join('')+'</div></div>'+
(isDay&&r.run=='8 Hour'?'<div class="fr"><label class="lb">Which part of the day</label><div style="display:flex;gap:18px;flex-wrap:wrap">'+['Morning','Afternoon'].map(function(k){return '<label class="cb" style="display:flex;gap:6px;align-items:center"><input type="radio" name="part" value="'+k+'"'+(r.part==k?' checked':'')+'> '+k+'</label>'}).join('')+'</div></div>':'')+
'<div class="fr"><label class="lb"></label><div class="hint" style="color:var(--mute);font-size:13px">The sections below follow the shift length.</div></div>'+
'<div class="fr"><label class="lb" for="fd">Date</label><input type="date" id="fd" value="'+r.d+'"></div><div class="fr"><label class="lb" for="fr">Residence</label><input type="text" id="fr" value="'+SITE+'" disabled></div><div class="fr"><label class="lb" for="fa">Staff 1</label><select id="fa">'+opts(r.a)+'</select></div><div class="fr"><label class="lb" for="fb">Staff 2</label><select id="fb">'+opts(r.b)+'</select></div>'+
S.map(function(s,a){return '<div class="band">'+s[0]+'</div>'+s[1].map(function(t,b){var k=a+'_'+b;return '<div class="fr"><label class="lb" for="k'+k+'">'+t+'</label><input type="checkbox" id="k'+k+'" data-t="'+t+'"'+(r.c[t]?' checked':'')+'></div>'}).join('')}).join('')+'</div>';
function grab(){var c={};v.querySelectorAll('input[data-t]').forEach(function(x){if(x.checked)c[x.dataset.t]=1});return c}
function pick(){var q=v.querySelector('input[name=part]:checked');return {d:$('fd').value,run:v.querySelector('input[name=run]:checked').value,part:q?q.value:r.part,a:$('fa').value,b:$('fb').value,c:grab()}}
v.querySelectorAll('input[name=run],input[name=part]').forEach(function(x){x.onchange=function(){tv.draft=pick();view()}});
$('sv-save').onclick=function(){var d=$('fd').value;if(!d){$('fd').classList.add('bad');$('fd').focus();return}
var n=pick();
if(tv.i===null)R.unshift(n);else R[tv.i]=n;
tv={m:'list',msg:'Item saved'};view()};
$('sv-cancel').onclick=function(){tv={m:'list'};view()}}
var xp=null,rp={src:'Chores',shift:'All',from:'2026-10-01',to:'2026-10-31'};
function repData(){var f=rp.from||'0000',t=rp.to||'9999',cols,rows=[];
if(rp.src=='Chores'){cols=['Date','Shift','Running','Staff 1','Staff 2','Chores done'];['Day Chores','Night Chores'].forEach(function(k){var sh=k.split(' ')[0];if(rp.shift!='All'&&rp.shift!=sh)return;recs(k).forEach(function(r){if(r.d<f||r.d>t)return;var n=0;for(var q in r.c)if(r.c[q])n++;rows.push([r.d,sh,r.run+(k=='Day Chores'&&r.run=='8 Hour'?' ('+r.part+')':''),r.a=='None'?'':r.a,r.b=='None'?'':r.b,n])})});rows.sort(function(a,b){return a[0]<b[0]?1:-1})}
else if(rp.src=='Shift Exchange Forms'){cols=['Created','Date','Shift','Running','Staff Name','Second Staff','Communication Update'];XR.forEach(function(x){if(x.d<f||x.d>t)return;rows.push([x.c,x.d,x.shift,x.run,x.a=='None'?'':x.a,x.b=='None'?'':x.b,x.n])})}
else{cols=['Item','Expected','Counted','Result'];sharps.forEach(function(r,i){var c=cnt[i];rows.push([r[0],r[1],c===undefined?'':c,c===undefined||c===''?'':(+c==r[1]?'Match':'Check')])})}
return {cols:cols,rows:rows}}
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function reportView(v){var D=repData(),isCh=rp.src=='Chores',title=cur;
v.innerHTML='<div class="sv"><div class="crumbs"><span>Home</span> / <span>Residences</span> / <span>'+SITE+'</span> / <span>'+cur+'</span> / <b>Export Report</b></div><div class="gl"></div>'+(rp.msg?'<div class="toast" role="status">'+rp.msg+'</div>':'')+'<div class="acts"><button class="act" id="rx"><i class="ok">&#8681;</i>Export CSV</button><button class="act" id="rc"><i class="no">&minus;</i>Cancel</button></div><div class="ftitle">'+cur+' - '+SITE+' - Export Report</div>'+
'<div class="fr"><label class="lb">Residence</label><input type="text" value="'+SITE+'" disabled></div>'+
'<div class="fr"><label class="lb" for="rf">From</label><input type="date" id="rf" value="'+rp.from+'"></div><div class="fr"><label class="lb" for="rt">To</label><input type="date" id="rt" value="'+rp.to+'"></div>'+
'<div class="band">Preview ('+D.rows.length+' record'+(D.rows.length==1?'':'s')+')</div><div class="wrap"><table class="g"><thead><tr>'+D.cols.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr></thead><tbody>'+(D.rows.length?D.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join(''):'<tr><td colspan="'+D.cols.length+'">No records to display</td></tr>')+'</tbody></table></div></div>';
rp.msg='';
['rf','rt'].forEach(function(id){$(id).onchange=function(){rp.from=$('rf').value;rp.to=$('rt').value;view()}});
$('rc').onclick=function(){xp=null;tv={m:'list'};xs={m:'list'};view()};
$('rx').onclick=function(){var q=function(c){return '"'+String(c).replace(/"/g,'""')+'"'};
var csv=[D.cols].concat(D.rows).map(function(r){return r.map(q).join(',')}).join('\r\n');
var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=cur.replace(/ /g,'-').toLowerCase()+'-report.csv';document.body.appendChild(a);a.click();a.remove();
rp.msg='Report exported ('+D.rows.length+' records)';view()}}
function menu(){var d=mode=='new'?NEW:NOW;
$('menu').innerHTML='<div class="hd">Axis Family Resources<small>Sample Respite Home</small></div>'+d.map(function(x){
return '<div class="grp">'+x.g+(x.n?'<span class="tag">Proposed</span>':'')+'</div>'+x.i.map(function(y){
var live=x.n||false;return '<button class="item'+(x.n?' newbox':' static')+'" data-v="'+y+'"'+(cur==y&&x.n?' aria-current="true"':'')+'>'+y+'</button>'}).join('')}).join('')+
'<div class="legend">'+(mode=='new'?'Green edge marks what would be added to the Residence page.':'This is the Residence menu as it stands today.')+'</div>';
$('bNow').setAttribute('aria-pressed',mode=='now');$('bNew').setAttribute('aria-pressed',mode=='new')}
function ctx(){return '<div class="ctx">Sample Respite Home currently serves:<div class="ppl"><span>Person Served A</span><span>Person Served B</span><span>Person Served C</span></div></div>'}
function view(){var v=$('view');
if(xp&&xp.cur==cur&&mode!='now')return reportView(v);
if(mode=='now'){v.innerHTML='<h2>Residence Details</h2><div class="in">'+ctx()+'<p>Today the Shift Exchange items live on each Person Served profile. On a program with several people, staff open each profile to complete or find the same handover.</p></div>';return}
if(cur=='Shift Exchange Forms')return exchangeView(v);
if(cur.indexOf('Sharps')==0){v.innerHTML='<h2>Sharps and Knife Count at Shift Exchange</h2><div class="in">'+ctx()+
'<div class="wrap"><table><thead><tr><th>Item</th><th>Expected</th><th>Counted</th><th>Result</th></tr></thead><tbody>'+sharps.map(function(r,i){var c=cnt[i];var res=c===undefined||c===''?'':(+c==r[1]?'<span class="st ok">Match</span>':'<span class="st p">Check</span>');return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td><input type="number" min="0" data-i="'+i+'" value="'+(c===undefined?'':c)+'"></td><td>'+res+'</td></tr>'}).join('')+'</tbody></table></div><p class="meta">One count per shift change for the whole residence, not one per person.</p></div>';
v.querySelectorAll('input').forEach(function(x){x.onchange=function(){cnt[x.dataset.i]=x.value;view()}});return}
taskView(v)}
$('menu').onclick=function(e){var b=e.target.closest('.item');if(b&&!b.classList.contains('static')){cur=b.dataset.v;xp=null;tv={m:'list'};xs={m:'list'};menu();view()}};
$('bNow').onclick=function(){mode='now';menu();view()};$('bNew').onclick=function(){mode='new';menu();view()};
menu();view();
</script>
